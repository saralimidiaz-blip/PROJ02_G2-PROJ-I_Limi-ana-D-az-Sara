<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Qué publicación necesitas? · Mockup interactivo</title>
<style>
  /* ============================================================
     COLORES Y MEDIDAS (puedes cambiarlos aquí)
     ============================================================ */
  :root {
    --fondo: #e9e9e9;          /* gris claro, como en los mockups */
    --magenta: #d60c6f;        /* magenta del libro */
    --texto: #2b2b2b;
    --duracion: 0.9s;          /* lo que tarda en pasar una página */
    --ratio: 0.7727;           /* 170 / 220 mm: proporción de la página */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at 50% 40%, #f4f4f4 0%, var(--fondo) 70%);
    font-family: "Mozilla Headline", "Helvetica Neue", Arial, sans-serif;
    color: var(--texto);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
  }

  header {
    position: fixed; top: 28px; left: 40px; right: 40px;
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 14px; letter-spacing: 0.02em;
  }
  header strong { font-weight: 600; }
  header span { color: #777; }

  /* ---------- escenario con perspectiva 3D ---------- */
  .escenario {
    perspective: 2600px;
    perspective-origin: 50% 40%;
  }

  /* el libro ocupa el ancho de una doble página */
  .libro {
    position: relative;
    width: calc(var(--pw) * 2);
    height: var(--ph);
    transform-style: preserve-3d;
    transition: transform var(--duracion) cubic-bezier(.45,.05,.25,1);
  }
  /* cerrado por delante o por detrás: se centra la cubierta */
  .libro.cerrado-delante { transform: translateX(calc(var(--pw) * -0.5)); }
  .libro.cerrado-detras  { transform: translateX(calc(var(--pw) *  0.5)); }

  /* sombra en el suelo */
  .sombra {
    position: absolute; left: 4%; right: 4%; bottom: -26px; height: 40px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,.28) 0%, rgba(0,0,0,0) 70%);
    filter: blur(6px);
    transition: left var(--duracion), right var(--duracion);
    transform: translateZ(-2px);
  }
  .libro.cerrado-delante .sombra { left: 52%; right: 2%; }
  .libro.cerrado-detras  .sombra { left: 2%;  right: 52%; }

  /* ---------- cada hoja ---------- */
  .hoja {
    position: absolute;
    top: 0; left: 50%;
    width: var(--pw); height: var(--ph);
    transform-origin: left center;
    transform-style: preserve-3d;
    transition: transform var(--duracion) cubic-bezier(.45,.05,.25,1);
    cursor: pointer;
  }
  .hoja.pasada { transform: rotateY(-180deg); }

  .cara {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background: #fff;
    overflow: hidden;
  }
  .cara img { width: 100%; height: 100%; display: block; object-fit: cover; pointer-events: none; }
  .cara.detras { transform: rotateY(180deg); }

  /* sombra del lomo: da la sensación de papel que se curva */
  .cara.delante::after, .cara.detras::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 14%;
    pointer-events: none;
  }
  .cara.delante::after { left: 0;  background: linear-gradient(to right, rgba(0,0,0,.18), rgba(0,0,0,0)); }
  .cara.detras::after  { right: 0; background: linear-gradient(to left,  rgba(0,0,0,.18), rgba(0,0,0,0)); }

  /* brillo que recorre la página mientras gira */
  .cara .luz {
    position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: linear-gradient(to right, rgba(0,0,0,.0) 40%, rgba(0,0,0,.12));
    transition: opacity calc(var(--duracion) / 2);
  }
  .hoja.girando .cara .luz { opacity: 1; }

  /* las cubiertas son de cartulina: sin sombra de lomo y un poco más gruesas */
  .hoja.tapa .cara::after { display: none; }
  .hoja.tapa .cara { box-shadow: 0 0 0 1px rgba(0,0,0,.06); }

  /* ---------- controles ---------- */
  .controles {
    position: fixed; bottom: 34px; left: 0; right: 0;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  .botones { display: flex; align-items: center; gap: 22px; }
  button {
    width: 46px; height: 46px; border-radius: 50%;
    border: none; background: var(--texto); color: #fff;
    font-size: 20px; cursor: pointer;
    transition: transform .15s, background .15s, opacity .2s;
  }
  button:hover { background: var(--magenta); transform: scale(1.06); }
  button:disabled { opacity: .25; cursor: default; transform: none; background: var(--texto); }
  #contador { min-width: 170px; text-align: center; font-size: 15px; }

  input[type=range] {
    width: min(520px, 70vw); accent-color: var(--magenta); cursor: pointer;
  }
  .ayuda { font-size: 12px; color: #888; }
</style>
</head>
<body>

<header>
  <div><strong>¿Qué publicación necesitas?</strong> · Manual de diseño editorial</div>
  <span>Sara Limiñana Díaz · 170 × 220 mm · 52 páginas</span>
</header>

<div class="escenario">
  <div class="libro cerrado-delante" id="libro">
    <div class="sombra"></div>
  </div>
</div>

<div class="controles">
  <div class="botones">
    <button id="anterior" aria-label="Página anterior">&#8592;</button>
    <div id="contador">Cubierta</div>
    <button id="siguiente" aria-label="Página siguiente">&#8594;</button>
  </div>
  <input type="range" id="barra" min="0" max="28" value="0" aria-label="Ir a página">
  <div class="ayuda">Haz clic en una página, usa las flechas del teclado o desliza en el móvil</div>
</div>

<script>
/* ============================================================
   1. LISTA DE HOJAS
   Cada hoja tiene una cara delante (página impar, a la derecha)
   y una cara detrás (página par, a la izquierda).
   ============================================================ */
const CARPETA = "imagenes/";
const TOTAL_PAGINAS = 52;

const hojas = [];
hojas.push({ delante: "cubierta.jpg", detras: null, tapa: true });          // cubierta
for (let p = 1; p <= TOTAL_PAGINAS; p += 2) {
  const num = n => "p" + String(n).padStart(2, "0") + ".jpg";
  hojas.push({ delante: num(p), detras: num(p + 1) });                      // páginas interiores
}
hojas.push({ delante: null, detras: "contracubierta.jpg", tapa: true });    // contracubierta

/* ============================================================
   2. CONSTRUIR EL LIBRO
   ============================================================ */
const libro = document.getElementById("libro");
const N = hojas.length;
let actual = 0;          // número de hojas ya pasadas
let ocupado = false;     // evita pasar páginas mientras otra gira

function cara(clase, imagen) {
  const div = document.createElement("div");
  div.className = "cara " + clase;
  if (imagen) {
    const img = document.createElement("img");
    img.src = CARPETA + imagen;
    img.alt = "";
    img.draggable = false;
    div.appendChild(img);
  }
  const luz = document.createElement("div");
  luz.className = "luz";
  div.appendChild(luz);
  return div;
}

const elementos = hojas.map((h, i) => {
  const hoja = document.createElement("div");
  hoja.className = "hoja" + (h.tapa ? " tapa" : "");
  hoja.appendChild(cara("delante", h.delante));
  hoja.appendChild(cara("detras", h.detras));
  // clic: en la derecha avanza, en la izquierda retrocede
  hoja.addEventListener("click", () => {
    if (hoja.classList.contains("pasada")) anterior(); else siguiente();
  });
  libro.appendChild(hoja);
  return hoja;
});

/* ============================================================
   3. TAMAÑO: la página se adapta a la pantalla
   ============================================================ */
function ajustarTamano() {
  const ratio = 170 / 220;
  const altoMax = window.innerHeight * 0.68;
  const anchoMax = window.innerWidth * 0.86 / 2;
  let alto = altoMax;
  let ancho = alto * ratio;
  if (ancho > anchoMax) { ancho = anchoMax; alto = ancho / ratio; }
  document.documentElement.style.setProperty("--pw", ancho + "px");
  document.documentElement.style.setProperty("--ph", alto + "px");
}
window.addEventListener("resize", ajustarTamano);
ajustarTamano();

/* ============================================================
   4. ORDEN DE LAS HOJAS (cuál queda encima)
   ============================================================ */
function ordenar() {
  elementos.forEach((hoja, i) => {
    hoja.style.zIndex = i < actual ? i + 1 : N - i;
  });
  libro.classList.toggle("cerrado-delante", actual === 0);
  libro.classList.toggle("cerrado-detras", actual === N);
  actualizarInterfaz();
}

/* ============================================================
   5. PASAR PÁGINA
   ============================================================ */
function girar(indice, haciaDelante) {
  return new Promise(resolve => {
    const hoja = elementos[indice];
    hoja.style.zIndex = N + 10;              // encima de todo mientras gira
    hoja.classList.add("girando");
    hoja.classList.toggle("pasada", haciaDelante);
    actual += haciaDelante ? 1 : -1;
    libro.classList.toggle("cerrado-delante", actual === 0);
    libro.classList.toggle("cerrado-detras", actual === N);
    actualizarInterfaz();
    const duracion = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--duracion")) * 1000;
    setTimeout(() => {
      hoja.classList.remove("girando");
      ordenar();
      resolve();
    }, duracion);
  });
}

async function siguiente() {
  if (ocupado || actual >= N) return;
  ocupado = true; await girar(actual, true); ocupado = false;
}
async function anterior() {
  if (ocupado || actual <= 0) return;
  ocupado = true; await girar(actual - 1, false); ocupado = false;
}

/* saltar a una hoja concreta con la barra, pasando las páginas seguidas */
async function irA(destino) {
  if (ocupado) return;
  ocupado = true;
  document.documentElement.style.setProperty("--duracion", "0.35s");
  while (actual < destino) await girar(actual, true);
  while (actual > destino) await girar(actual - 1, false);
  document.documentElement.style.setProperty("--duracion", "0.9s");
  ocupado = false;
}

/* ============================================================
   6. CONTADOR, BOTONES Y BARRA
   ============================================================ */
const contador = document.getElementById("contador");
const barra = document.getElementById("barra");
const btnAnterior = document.getElementById("anterior");
const btnSiguiente = document.getElementById("siguiente");
barra.max = N;

function actualizarInterfaz() {
  if (actual === 0) contador.textContent = "Cubierta";
  else if (actual === N) contador.textContent = "Contracubierta";
  else if (actual === 1) contador.textContent = "Página 1";
  else if (actual === N - 1) contador.textContent = "Página " + TOTAL_PAGINAS;
  else {
    const izquierda = (actual - 1) * 2;
    contador.textContent = "Páginas " + izquierda + "–" + (izquierda + 1);
  }
  btnAnterior.disabled = actual === 0;
  btnSiguiente.disabled = actual === N;
  barra.value = actual;
}

btnSiguiente.addEventListener("click", siguiente);
btnAnterior.addEventListener("click", anterior);
barra.addEventListener("change", e => irA(parseInt(e.target.value, 10)));

document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") siguiente();
  if (e.key === "ArrowLeft") anterior();
});

/* deslizar con el dedo en móvil o tableta */
let inicioX = null;
document.addEventListener("touchstart", e => { inicioX = e.touches[0].clientX; });
document.addEventListener("touchend", e => {
  if (inicioX === null) return;
  const dx = e.changedTouches[0].clientX - inicioX;
  if (dx < -40) siguiente();
  if (dx > 40) anterior();
  inicioX = null;
});

ordenar();
</script>
</body>
</html>
